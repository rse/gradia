#   [tool] static code analysis (linting)
lint
    eslint --config etc/eslint.mjs src/*.ts

#   [tool] static code analysis (linting) with file watching
lint-watch
    nodemon --exec "npm start lint" --watch src --ext ts

#   [tool] code compilation/transpiling (building) with file watching
build-watch
    nodemon --exec "npm start build" --watch src --ext ts

#   [tool] build entire project
build : lint build-cmd build-web

#   [tool] build command program
build-cmd
    tsc --project etc/tsconfig.json

#   [tool] build browser library (bundling)
build-web
    vite --config etc/vite.ts build --logLevel error

#   [tool] render the sample diagrams (diagram
#   type taken from their "#type" directives)
sample
    node dst/gradia-cli.js -o smp/sample-graph-regular.svg   smp/sample-graph-regular.txt
    node dst/gradia-cli.js -o smp/sample-graph-crowded.svg   smp/sample-graph-crowded.txt
    node dst/gradia-cli.js -o smp/sample-graph-simple.svg    smp/sample-graph-simple.txt
    node dst/gradia-cli.js -o smp/sample-graph-container.svg smp/sample-graph-container.txt
    node dst/gradia-cli.js -o smp/sample-graph-badges.svg    smp/sample-graph-badges.txt
    node dst/gradia-cli.js -o smp/sample-hub-regular.svg     smp/sample-hub-regular.txt
    node dst/gradia-cli.js -o smp/sample-hub-crowded.svg     smp/sample-hub-crowded.txt
    node dst/gradia-cli.js -o smp/sample-grid-regular.svg    smp/sample-grid-regular.txt
    node dst/gradia-cli.js -o smp/sample-sequence-regular.svg smp/sample-sequence-regular.txt
    node dst/gradia-cli.js -o smp/sample-layer-regular.svg   smp/sample-layer-regular.txt
    node dst/gradia-cli.js -o smp/sample-slice-regular.svg   smp/sample-slice-regular.txt
    node dst/gradia-cli.js -o smp/sample-tree-regular.svg    smp/sample-tree-regular.txt
    node dst/gradia-cli.js -o smp/sample-tree-stacked.svg    smp/sample-tree-stacked.txt
    node dst/gradia-cli.js -o smp/sample-tree-double.svg     smp/sample-tree-double.txt
    node dst/gradia-cli.js -o smp/sample-matrix-regular.svg  smp/sample-matrix-regular.txt
    node dst/gradia-cli.js -o smp/sample-matrix-full.svg     smp/sample-matrix-full.txt
    node dst/gradia-cli.js -o smp/sample-state-regular.svg   smp/sample-state-regular.txt
    node dst/gradia-cli.js -o smp/sample-state-advanced.svg  smp/sample-state-advanced.txt

#   [tool] render the regression diagrams as the reference
#   (before a change to the rendering)
regression-before
    for f in smp/broadcast.d/*.txt; do \
        echo "RENDERING: $f"; \
        node dst/gradia-cli.js -o "${f%.txt}.before.svg" "$f"; \
    done

#   [tool] render the regression diagrams anew (after a change to
#   the rendering) and report the ones differing from the reference
regression-after
    for f in smp/broadcast.d/*.txt; do \
        echo "RENDERING: $f"; \
        node dst/gradia-cli.js -o "${f%.txt}.after.svg" "$f"; \
        cmp -s "${f%.txt}.before.svg" "${f%.txt}.after.svg" || echo "DIFFERENT: $f"; \
    done

#   [tool] remove the rendered regression diagrams
regression-clean
    shx rm -f smp/broadcast.d/*.before.svg
    shx rm -f smp/broadcast.d/*.after.svg

#   [tool] remove regularly built files
clean
    shx rm -rf dst

#   [tool] remove all built files
distclean : clean
    shx rm -f package-lock.json
    shx rm -rf node_modules

