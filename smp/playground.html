<html>
    <head>
        <title>Gradia Playground</title>
        <meta charset="UTF-8"/>
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/vue@3.5.41/dist/vue.global.prod.js"></script>
        <script src="../dst/gradia-api.umd.js"></script>
        <style>
            [v-cloak] {
                display: none;
            }
            html, body {
                margin: 0;
                height: 100%;
            }
            body {
                background-color: #303030;
                color: #ffffff;
                font-family: "Source Sans Pro", sans-serif;
                font-size: 11pt;
                box-sizing: border-box;
                padding: 30px 50px;
            }
            .app {
                display: flex;
                flex-direction: column;
                height: 100%;
            }
            .app h1 {
                margin: 0 0 10px 0;
            }
            .app .toolbar {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 8px;
                margin-bottom: 16px;
            }
            .app .toolbar .label {
                color: #c0c0c0;
                margin-left: 12px;
            }
            .app .toolbar .label:first-child {
                margin-left: 0;
            }
            .app .toolbar select {
                color: #f0f0f0;
                background-color: #505050;
                border: 0;
                border-radius: 4px;
                font-family: "Source Code Pro", monospace;
                font-size: 11pt;
                padding: 4px 8px;
            }
            .app .toolbar select:hover,
            .app .toolbar select:focus {
                color: #b0d0ff;
                background-color: #507090;
                outline: none;
            }
            .app .panes {
                display: flex;
                flex-direction: row;
                gap: 16px;
                flex-grow: 1;
                min-height: 0;
            }
            .app .panes .editor {
                width: 34%;
                color: #f0f0f0;
                background-color: #404040;
                border: 0;
                border-radius: 4px;
                font-family: "Source Code Pro", monospace;
                font-size: 10pt;
                padding: 12px;
                resize: none;
                white-space: pre;
                outline: none;
            }
            .app .panes .editor:hover,
            .app .panes .editor:focus {
                background-color: #444850;
            }
            .app .panes .output {
                width: 66%;
                background-color: #ffffff;
                border-radius: 4px;
                overflow: auto;
                padding: 12px;
            }
            .app .panes .output svg {
                max-width: 100%;
                height: auto;
            }
            .app .panes .output .error {
                color: #cc3333;
                font-family: "Source Code Pro", monospace;
                font-size: 10pt;
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <div class="app" v-cloak>
            <h1>Gradia Playground</h1>
            <div class="toolbar">
                <div class="label">sample:</div>
                <select v-model="sample">
                    <option v-for="name in sampleNames" v-bind:key="name" v-bind:value="name">{{ name }}</option>
                </select>
            </div>
            <div class="panes">
                <textarea class="editor" v-model="input" spellcheck="false"></textarea>
                <div class="output">
                    <div v-if="error !== ''" class="error">{{ error }}</div>
                    <div v-else v-html="svg"></div>
                </div>
            </div>
        </div>

order:   "Order"          [ type: ENTITY ]
db:      "Order Database" [ type: ENTITY ]
audit:   "Audit Log"

client  --("POST /orders")--> gateway { time: "t=now" }
gateway --("validate token")--> gateway
gateway --("token valid")--> gateway { kind: return }
gateway --(createOrder)--> service { duration: "{< 300ms}" }
service --("new Order")--> order { kind: create }
order   --(order)--> service { kind: return }
service --("INSERT order")--> db
db      --("order id")--> service { kind: return }
service --(dispose)--> order { kind: destroy }
service --("order created")--> audit { kind: async }
service --("201 Created")--> gateway { kind: return }
gateway --("201 Created")--> client { kind: return }
        </script>

        <script>
            /*  access the Gradia API class from the "Gradia" namespace
                provided globally by the browser UMD bundle  */
            const GradiaAPI = window.Gradia?.Gradia ?? null
            const loadError = GradiaAPI !== null ? "" :
                "failed to load the Gradia API from \"../dst/gradia-api.umd.js\" " +
                "(build it with \"npm start build\" and serve the repository root over HTTP)"

            /*  fetch an embedded sample graph description  */
            const sampleOf = (id) =>
                document.getElementById(id).textContent.replace(/^\n/, "")

            /*  the embedded samples (their diagram type is determined
                by their own "#type <type>" directive)  */
            const samples = {
                "graph-regular":    sampleOf("sample-graph-regular"),
                "graph-crowded":    sampleOf("sample-graph-crowded"),
                "graph-simple":     sampleOf("sample-graph-simple"),
                "graph-container":  sampleOf("sample-graph-container"),
                "graph-badges":     sampleOf("sample-graph-badges"),
                "hub-regular":      sampleOf("sample-hub-regular"),
                "hub-crowded":      sampleOf("sample-hub-crowded"),
                "grid-regular":     sampleOf("sample-grid-regular"),
                "layer-regular":    sampleOf("sample-layer-regular"),
                "slice-regular":    sampleOf("sample-slice-regular"),
                "tree-regular":     sampleOf("sample-tree-regular"),
                "tree-stacked":     sampleOf("sample-tree-stacked"),
                "tree-double":      sampleOf("sample-tree-double"),
                "matrix-regular":   sampleOf("sample-matrix-regular"),
                "matrix-full":      sampleOf("sample-matrix-full"),
                "sequence-regular": sampleOf("sample-sequence-regular")
            }

            const app = Vue.createApp({
                data () {
                    return {
                        sampleNames: Object.keys(samples),
                        sample:      "graph-regular",
                        input:       samples["graph-regular"],
                        svg:         "",
                        error:       ""
                    }
                },
                created () {
                    /*  the debounce timer and render sequence guard (non-reactive)  */
                    this.timer = null
                    this.seq   = 0
                },
                watch: {
                    /*  selecting a sample overrides the input box content  */
                    sample () {
                        this.input = samples[this.sample]
                    },
                    input: {
                        handler () { this.renderDebounced() },
                        immediate: true
                    }
                },
                methods: {
                    /*  re-render (debounced against rapid typing)  */
                    renderDebounced () {
                        if (this.timer !== null)
                            clearTimeout(this.timer)
                        this.timer = setTimeout(() => { this.render() }, 250)
                    },

                    /*  render the input into an embeddable SVG through the Gradia
                        API, with the diagram type taken from the "#type <type>"
                        directive of the input (the sequence guard discards
                        out-of-order async results)  */
                    async render () {
                        const seq = ++this.seq
                        if (GradiaAPI === null) {
                            this.error = loadError
                            return
                        }
                        try {
                            const svg = await GradiaAPI.render(this.input,
                                { format: "svg:embedded" })
                            if (seq === this.seq) {
                                this.svg   = svg
                                this.error = ""
                            }
                        }
                        catch (ex) {
                            if (seq === this.seq)
                                this.error = ex instanceof Error ? ex.message : String(ex)
                        }
                    }
                }
            })
            app.mount(".app")
        </script>
    </body>
</html>
